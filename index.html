<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 5학년 사회 - 조선 시대 심화 학습 퀴즈</title>
    <style>
        :root {
            --primary-color: #7b1fa2;
            --primary-light: #f3e5f5;
            --secondary-color: #4a148c;
            --background: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --correct-color: #2e7d32;
            --incorrect-color: #c62828;
            --border-radius: 12px;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--background);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            border: 2px solid #e0e0e0;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--secondary-color);
            font-size: 1.6rem;
            margin: 0 0 10px 0;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #eee;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress {
            width: 0%;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .question-number {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .option-btn.correct {
            border-color: var(--correct-color);
            background-color: #e8f5e9;
            color: var(--correct-color);
            font-weight: bold;
        }

        .option-btn.incorrect {
            border-color: var(--incorrect-color);
            background-color: #ffebee;
            color: var(--incorrect-color);
        }

        .explanation {
            display: none;
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .nav-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            float: right;
            display: none;
        }

        .nav-btn:hover {
            background-color: var(--secondary-color);
        }

        .result-box {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .score-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 15px;
        }

        .restart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .restart-btn:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>조선 시대 역사 심화 탐구 퀴즈</h1>
        <div class="subtitle">초등학교 5학년 사회 - 건국부터 후기 사회 변화까지</div>
    </header>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <div id="quiz-container">
        <!-- Questions generated via JavaScript -->
    </div>

    <div class="result-box" id="result-box">
        <h2>퀴즈 종료!</h2>
        <div class="score-text" id="score-text"></div>
        <p id="result-message"></p>
        <button class="restart-btn" onclick="restartQuiz()">다시 풀기</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "조선 전기 세종대왕 시기에 집현전 학자들이 중심이 되어 완성한 역법서로, 서울을 기준으로 천체 운동을 계산한 우리나라 최초의 역법서는 무엇일까요?",
            options: ["칠정산", "농사직설", "삼강행실도", "동의보감"],
            answer: 0,
            explanation: "《칠정산》은 중국이나 Arab의 역법을 참고하되, 조선의 수도인 한양(서울)을 기준으로 해와 달, 5개 행성의 움직임을 계산한 역사상 최초의 독자적 역법서입니다."
        },
        {
            question: "조선 시대 국가의 최고 법전으로, 성종 때 완성되어 조선의 정치, 경제, 사회 제도의 기틀을 확립한 법전의 이름은 무엇일까요?",
            options: ["경국대전", "속대전", "대전통편", "대전회통"],
            answer: 0,
            explanation: "《경국대전》은 세조 때 편찬을 시작하여 성종 때 완성된 조선 기본 법전으로, 6전(이·호·예·병·형·공전) 체제로 구성되어 유교적 통치 질서를 확립했습니다."
        },
        {
            question: "임진왜란 당시 조선 수군이 왜군을 크게 무찌른 '한산도 대첩'에서 사용한 대표적인 해전 진법(진형)은 무엇일까요?",
            options: ["학익진", "장사진", "방진", "어린진"],
            answer: 0,
            explanation: "이순신 장군은 한산도 대첩에서 배를 학의 날개 모양으로 펼쳐 적을 둘러싸는 '학익진'을 펼쳐 화포를 집중 사격함으로써 대승을 거두었습니다."
        },
        {
            question: "조선 후기 영조와 정조가 당파 간의 대립을 완화하고 왕권을 강화하기 위해 실시한 정치 정책은 무엇일까요?",
            options: ["탕평책", "대동법", "균역법", "호포제"],
            answer: 0,
            explanation: "탕평책은 학문과 능력에 따라 인재를 공정하게 등용하여 붕당 간의 갈등을 완화하고자 한 정책입니다."
        },
        {
            question: "조선 후기 공납(특산물 납부)의 폐단을 막기 위해 특산물 대신 쌀, 베, 돈 등으로 납부하게 한 개혁 제도 정책은 무엇일까요?",
            options: ["대동법", "균역법", "영정법", "직전법"],
            answer: 0,
            explanation: "대동법은 방납의 폐단을 줄이고 방납업자의 수탈로부터 농민을 보호하기 위해 특산물 대신 토지 면적에 따라 쌀(대동미), 면포, 동전 등으로 거두게 한 제도입니다."
        },
        {
            question: "정조 때 만들어진 국왕 직속의 왕실 도서관이자 학문 연구 기관으로, 젊은 학자들을 육성하고 정책을 연구했던 기관은 무엇일까요?",
            options: ["규장각", "집현전", "성균관", "홍문관"],
            answer: 0,
            explanation: "정조는 규장각을 설치하여 젊고 능력이 뛰어난 학자들을 뽑아 연구하게 하고, 국왕의 정치적 기반을 강화했습니다."
        },
        {
            question: "조선 후기 실학자 정약용이 거중기와 서양의 과학 기술을 활용하여 축조한 계획도시 성곽은 무엇일까요?",
            options: ["수원 화성", "남한산성", "북한산성", "진주성"],
            answer: 0,
            explanation: "수원 화성은 정조의 개혁 의지와 정약용의 과학 기술(거중기 등)이 결합하여 건설된 조선 후기의 대표적인 성곽 architecture입니다."
        },
        {
            question: "조선 후기 신분제의 변화 속에서 나타난 사회 현상으로 올바르지 않은 것은 무엇일까요?",
            options: [
                "양반의 수가 크게 줄어들고 노비의 수가 급격히 늘어났다.",
                "공명첩이나 족보 매매를 통해 신분을 상승시키는 사람이 많아졌다.",
                "서얼과 중인 계층이 신분 차별 철폐 운동을 벌였다.",
                "재산을 모아 양반 신분을 얻는 부유한 농민이 등장했다."
            ],
            answer: 0,
            explanation: "조선 후기에는 공명첩 매매, 족보 구입, 노비 해방 등으로 인해 오히려 양반의 수가 급격히 늘어나고 상민과 노비의 수가 줄어들었습니다."
        }
    ];

    let currentQuestion = 0;
    let score = 0;

    function renderQuestions() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `q${index}`;

            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `<button class="option-btn" onclick="checkAnswer(${index}, ${optIndex})">${optIndex + 1}. ${opt}</button>`;
            });

            card.innerHTML = `
                <div class="question-number">문제 ${index + 1} / ${questions.length}</div>
                <div class="question-text">${q.question}</div>
                <div class="options">${optionsHTML}</div>
                <div class="explanation" id="exp${index}">${q.explanation}</div>
                <button class="nav-btn" id="btn${index}" onclick="nextQuestion(${index})">다음 문제</button>
            `;
            container.appendChild(card);
        });
        updateProgress();
    }

    function checkAnswer(qIndex, selectedOpt) {
        const card = document.getElementById(`q${qIndex}`);
        const buttons = card.querySelectorAll('.option-btn');
        const exp = document.getElementById(`exp${qIndex}`);
        const nextBtn = document.getElementById(`btn${qIndex}`);

        buttons.forEach(btn => btn.disabled = true);

        if (selectedOpt === questions[qIndex].answer) {
            buttons[selectedOpt].classList.add('correct');
            score++;
        } else {
            buttons[selectedOpt].classList.add('incorrect');
            buttons[questions[qIndex].answer].classList.add('correct');
        }

        exp.style.display = 'block';
        nextBtn.style.display = 'block';
    }

    function nextQuestion(qIndex) {
        document.getElementById(`q${qIndex}`).classList.remove('active');
        if (qIndex + 1 < questions.length) {
            currentQuestion++;
            document.getElementById(`q${currentQuestion}`).classList.add('active');
            updateProgress();
        } else {
            showResult();
        }
    }

    function updateProgress() {
        const percent = ((currentQuestion) / questions.length) * 100;
        document.getElementById('progress').style.width = `${percent}%`;
    }

    function showResult() {
        document.getElementById('progress').style.width = '100%';
        document.getElementById('quiz-container').style.display = 'none';
        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';

        const scoreText = document.getElementById('score-text');
        const message = document.getElementById('result-message');

        scoreText.innerText = `${questions.length}문제 중 ${score}문제 정답!`;

        if (score === questions.length) {
            message.innerText = "완벽합니다! 조선 시대 역사 심화 과정을 완벽하게 이해하고 계시네요!";
        } else if (score >= questions.length * 0.7) {
            message.innerText = "훌륭합니다! 조선 시대 주요 제도와 사건에 대해 매우 잘 알고 있습니다.";
        } else {
            message.innerText = "아쉽네요! 복습을 통해 조선 시대의 주요 제도와 신분제 변화를 다시 살펴보세요.";
        }
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        document.getElementById('quiz-container').style.display = 'block';
        document.getElementById('result-box').style.display = 'none';
        renderQuestions();
    }

    renderQuestions();
</script>

</body>
</html>
